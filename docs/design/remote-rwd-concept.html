<div id="remote-concept">
  <style>
    #remote-concept{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:light-dark(#142033,#edf3ff);background:transparent;width:100%}
    #remote-concept *{box-sizing:border-box}#remote-concept button{font:inherit}
    #remote-concept .rc-controls{display:flex;gap:8px;margin:0 0 12px;align-items:center;flex-wrap:wrap}
    #remote-concept .rc-controls button{border:1px solid light-dark(#d3dbea,#39445a);background:light-dark(#fff,#171d2a);color:inherit;border-radius:8px;padding:7px 11px;cursor:pointer}
    #remote-concept .rc-controls button[aria-pressed="true"]{background:#5b5ce2;color:white;border-color:#5b5ce2}
    #remote-concept .rc-divider{width:1px;height:28px;background:#39445a;margin:0 3px}
    #remote-concept .rc-stage{width:100%;overflow:hidden;border-radius:14px;border:1px solid light-dark(#cdd6e5,#384257);background:#0d1220;box-shadow:0 18px 50px rgba(12,20,38,.22)}
    #remote-concept .rc-app{width:100%;height:590px;display:grid;grid-template-columns:64px 254px minmax(0,1fr) 248px;grid-template-rows:56px 1fr;background:#111827;color:#edf3ff;transition:.25s ease}
    #remote-concept .rc-top{grid-column:1/-1;display:grid;grid-template-columns:318px 1fr auto;align-items:center;border-bottom:1px solid #293248;background:#151c2b;padding:0 14px;gap:18px}
    #remote-concept .rc-brand{display:flex;align-items:center;gap:10px;font-weight:750}.rc-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#7b7cf3,#3e8be8);display:grid;place-items:center;font-size:14px}
    #remote-concept .rc-quick{max-width:540px;height:34px;border:1px solid #35405a;border-radius:8px;background:#101624;color:#aebad1;display:flex;align-items:center;padding:0 11px;font-size:12px}
    #remote-concept .rc-actions{display:flex;gap:8px;align-items:center}.rc-action{border:0;border-radius:8px;padding:8px 11px;background:#5b5ce2;color:#fff;font-size:12px}.rc-lock{border:1px solid #3d4962;background:#20293b;color:#d8e1f4;border-radius:8px;padding:7px 9px;font-size:12px}
    #remote-concept .rc-rail{grid-row:2;background:#121927;border-right:1px solid #293248;padding:12px 8px;display:flex;flex-direction:column;gap:8px}.rc-rail button{height:42px;border:0;border-radius:9px;background:transparent;color:#92a0b8;font-size:17px}.rc-rail button:first-child{background:#293451;color:#9fa5ff}
    #remote-concept .rc-tree{grid-row:2;background:#171f2e;border-right:1px solid #293248;padding:14px 12px;overflow:hidden}.rc-pane-title{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between}.rc-search{height:32px;border:1px solid #35405a;background:#111827;border-radius:7px;padding:8px;color:#8795ad;font-size:11px;margin-bottom:14px}.rc-section{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#74829a;margin:12px 6px 6px}.rc-node{display:flex;gap:9px;align-items:center;padding:8px;border-radius:7px;font-size:12px;color:#c8d2e5}.rc-node.sel{background:#2c3552;color:#fff}.rc-dot{width:8px;height:8px;border-radius:50%;background:#47c28a}.rc-dot.vnc{background:#f5ae49}.rc-dot.ssh{background:#65a9f5}
    #remote-concept .rc-work{grid-row:2;min-width:0;background:#0d1220;display:grid;grid-template-rows:40px 42px 1fr}.rc-tabs{display:flex;align-items:end;border-bottom:1px solid #293248;background:#141b29;padding-left:8px}.rc-tab{height:34px;border:0;border-bottom:2px solid #7778ef;background:transparent;color:#fff;padding:0 13px;font-size:11px}.rc-tools{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #293248;background:#111827;color:#9aa8bd;font-size:11px}.rc-toolbtn{border:1px solid #303a50;background:#192131;color:#dce4f3;border-radius:6px;padding:5px 8px}.rc-session{margin:10px;background:linear-gradient(135deg,#203855,#15253b);border:1px solid #334762;border-radius:9px;position:relative;overflow:hidden}.rc-wall{position:absolute;inset:0;background:radial-gradient(circle at 78% 24%,rgba(91,92,226,.35),transparent 26%),linear-gradient(120deg,rgba(255,255,255,.04),transparent 55%)}.rc-osbar{position:absolute;left:7%;right:7%;bottom:6%;height:38px;border-radius:10px;background:rgba(10,18,29,.75);backdrop-filter:blur(10px);display:flex;justify-content:center;gap:8px;align-items:center}.rc-osbar span{width:22px;height:22px;border-radius:6px;background:#6097dd}.rc-osbar span:nth-child(2){background:#e2b94e}.rc-osbar span:nth-child(3){background:#6dcaa1}.rc-session-label{position:absolute;top:15px;left:16px;font-size:11px;color:#c6d6e9}
    #remote-concept .rc-inspector{grid-row:2;background:#171f2e;border-left:1px solid #293248;padding:16px 14px;overflow:hidden}.rc-card-title{font-size:14px;font-weight:700}.rc-sub{font-size:10px;color:#8290a7;margin-top:3px}.rc-field{margin-top:16px}.rc-label{font-size:10px;color:#7f8da5;margin-bottom:5px}.rc-value{font-size:12px;color:#e6edf8}.rc-idcard{margin-top:7px;border:1px solid #414c68;background:#20293b;border-radius:8px;padding:9px}.rc-scope{display:inline-block;margin-top:7px;border-radius:5px;background:#493f78;color:#c9c6ff;padding:3px 6px;font-size:9px}.rc-warning{margin-top:14px;padding:9px;border-left:2px solid #f0a63d;background:#282638;color:#e9d6b5;font-size:10px;line-height:1.45}
    #remote-concept .rc-app.medium{grid-template-columns:56px 220px minmax(0,1fr)}#remote-concept .rc-app.medium .rc-inspector{display:none}#remote-concept .rc-app.medium .rc-top{grid-template-columns:276px 1fr auto}#remote-concept .rc-app.medium .rc-quick{max-width:390px}
    #remote-concept .rc-app.compact{grid-template-columns:50px minmax(0,1fr);height:560px}#remote-concept .rc-app.compact .rc-tree,#remote-concept .rc-app.compact .rc-inspector{display:none}#remote-concept .rc-app.compact .rc-top{grid-template-columns:auto 1fr auto;padding:0 9px;gap:9px}#remote-concept .rc-app.compact .rc-brand strong,#remote-concept .rc-app.compact .rc-lock{display:none}#remote-concept .rc-app.compact .rc-quick{font-size:0}#remote-concept .rc-app.compact .rc-quick:after{content:'快速連線…';font-size:11px}#remote-concept .rc-app.compact .rc-action{padding:8px;font-size:0}#remote-concept .rc-app.compact .rc-action:after{content:'＋';font-size:15px}#remote-concept .rc-app.compact .rc-session{margin:7px}#remote-concept .rc-app.compact .rc-tools{overflow:hidden;white-space:nowrap}
    #remote-concept .rc-app.portrait{grid-template-columns:52px minmax(0,1fr);height:690px}#remote-concept .rc-app.portrait .rc-tree,#remote-concept .rc-app.portrait .rc-inspector{display:none}#remote-concept .rc-app.portrait .rc-top{grid-template-columns:auto 1fr auto;padding:0 9px;gap:9px}#remote-concept .rc-app.portrait .rc-brand strong,#remote-concept .rc-app.portrait .rc-lock{display:none}#remote-concept .rc-app.portrait .rc-session{margin:8px}#remote-concept .rc-app.portrait .rc-tools{overflow:hidden;white-space:nowrap}
    #remote-concept .rc-session.remote-portrait{background:#090d16}#remote-concept .rc-session.remote-portrait .rc-wall{inset:4% auto 4% 50%;width:min(38%,240px);transform:translateX(-50%);border:1px solid #455b76;box-shadow:0 10px 34px rgba(0,0,0,.45)}#remote-concept .rc-session.remote-portrait .rc-osbar{left:38%;right:38%;height:32px}
    @media(max-width:620px){#remote-concept .rc-app{grid-template-columns:50px minmax(0,1fr);height:540px}#remote-concept .rc-tree,#remote-concept .rc-inspector{display:none}#remote-concept .rc-top{grid-template-columns:auto 1fr auto;padding:0 8px;gap:8px}#remote-concept .rc-brand strong,#remote-concept .rc-lock{display:none}}
  </style>
  <div class="rc-controls" aria-label="Responsive preview sizes">
    <button type="button" data-size="wide" aria-pressed="true">1440 · 寬版</button>
    <button type="button" data-size="medium" aria-pressed="false">1024 · 中版</button>
    <button type="button" data-size="compact" aria-pressed="false">760 · 精簡版</button>
    <button type="button" data-size="portrait" aria-pressed="false">直式視窗</button>
    <span class="rc-divider" aria-hidden="true"></span>
    <button type="button" data-display="landscape" aria-pressed="true">遠端橫式</button>
    <button type="button" data-display="portrait" aria-pressed="false">遠端直式</button>
  </div>
  <div class="rc-stage">
    <div class="rc-app wide">
      <header class="rc-top"><div class="rc-brand"><span class="rc-logo">R</span><strong>Remote</strong></div><div class="rc-quick">⌘ K　快速連線：輸入主機名稱或位址</div><div class="rc-actions"><button class="rc-lock">🔒 Vault 已解鎖</button><button class="rc-action">＋ 新增連線</button></div></header>
      <nav class="rc-rail" aria-label="Primary"><button title="連線">⌁</button><button title="Vault">▣</button><button title="身份卡">♙</button><button title="稽核">≡</button></nav>
      <aside class="rc-tree"><div class="rc-pane-title"><span>連線</span><span>•••</span></div><div class="rc-search">⌕ 搜尋連線與標籤</div><div class="rc-section">我的最愛</div><div class="rc-node sel"><span class="rc-dot"></span>Windows Prod</div><div class="rc-section">基礎設施</div><div class="rc-node"><span class="rc-dot vnc"></span>Design Mac</div><div class="rc-node"><span class="rc-dot ssh"></span>Lab SSH</div><div class="rc-node"><span class="rc-dot"></span>Finance VM</div></aside>
      <main class="rc-work"><div class="rc-tabs"><button class="rc-tab">Windows Prod　×</button></div><div class="rc-tools"><button class="rc-toolbtn">重新整理</button><button class="rc-toolbtn">全螢幕</button><button class="rc-toolbtn">適應視窗</button><button class="rc-toolbtn">傳送 Ctrl+Alt+Del</button><span class="rc-resolution">RDP · 1920×1080</span></div><div class="rc-session"><div class="rc-wall"></div><div class="rc-session-label">Windows Prod · 已連線</div><div class="rc-osbar"><span></span><span></span><span></span></div></div></main>
      <aside class="rc-inspector"><div class="rc-card-title">Windows Prod</div><div class="rc-sub">生產環境 · RDP</div><div class="rc-field"><div class="rc-label">主機</div><div class="rc-value">10.20.0.24:3389</div></div><div class="rc-field"><div class="rc-label">身份卡</div><div class="rc-idcard"><div class="rc-value">Windows Admin</div><div class="rc-sub">CORP\\operator</div><span class="rc-scope">用途：僅限 RDP</span></div></div><div class="rc-field"><div class="rc-label">顯示</div><div class="rc-value">自動調整解析度</div></div><div class="rc-warning">這張身份卡指定給 RDP 使用，不會自動提供給 VNC 或其他協定。</div></aside>
    </div>
  </div>
  <script>
    (()=>{const root=document.getElementById('remote-concept');const app=root.querySelector('.rc-app');const session=root.querySelector('.rc-session');const resolution=root.querySelector('.rc-resolution');root.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{root.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');app.className='rc-app '+b.dataset.size;}));root.querySelectorAll('[data-display]').forEach(b=>b.addEventListener('click',()=>{root.querySelectorAll('[data-display]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');const portrait=b.dataset.display==='portrait';session.classList.toggle('remote-portrait',portrait);resolution.textContent=portrait?'RDP · 1080×1920 · 直式':'RDP · 1920×1080';}));})();
  </script>
</div>
